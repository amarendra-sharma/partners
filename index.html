<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacroNations Partners</title>
<meta name="description" content="The MacroNations partner portal: bring professors to MacroNations and share in the revenue from the courses you help launch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#13233F; --navy-2:#1D3357; --gold:#B8892B; --gold-soft:#F3E9D2;
  --paper:#F5F7FA; --card:#FFFFFF; --line:#D9DFE8; --line-2:#E9EDF3;
  --ink:#16202E; --ink-2:#4A5568; --ink-3:#7A8699;
  --money:#1E6B4F; --money-soft:#E3F1EA; --warn:#A23B32; --warn-soft:#F8E6E4; --amber:#9A6A00; --amber-soft:#FBF1D9;
  --serif:"Newsreader",Georgia,serif; --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:6px; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy-2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#B9C3D2}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--warn);border-color:#E5B9B4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 4px}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:9px 11px;font-size:15px}
.in:focus{border-color:var(--navy-2);outline:none;box-shadow:0 0 0 3px rgba(29,51,87,.12)}
textarea.in{min-height:90px;resize:vertical}
.field{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--ink-3);margin-top:4px}
.err{color:var(--warn);font-size:14px;min-height:1px}

/* ---------- auth / gate screens ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.gate-side{background:var(--navy);color:#E8ECF3;padding:56px 56px 40px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-size:19px;font-weight:600}
.gate-side h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.08;margin:72px 0 18px;color:#fff;max-width:17ch}
.gate-side p.lede{font-size:17px;color:#C5CEDC;max-width:44ch;margin:0 0 40px}
.how{list-style:none;padding:0;margin:0;counter-reset:s;max-width:46ch}
.how li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,.12)}
.how li::before{content:counter(s);font-family:var(--serif);font-size:20px;color:var(--gold)}
.how.plain li{grid-template-columns:1fr}
.how.plain li::before{content:none}
.how b{color:#fff;display:block;font-weight:600}
.how span{color:#AFBACB;font-size:14px}
.gate-side .foot{margin-top:auto;padding-top:32px;font-size:13px;color:#8D9AB0}
.gate-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.gate-box{width:100%;max-width:420px}
.gate-box h2{font-family:var(--serif);font-weight:500;font-size:30px;margin:0 0 6px}
.gate-box .sub{color:var(--ink-2);margin:0 0 24px}
.tabs-inline{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:8px;margin-bottom:22px}
.tabs-inline button{flex:1;border:0;background:transparent;padding:8px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.tabs-inline button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(19,35,63,.12)}
.center-card{max-width:620px;margin:56px auto;padding:0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.panel h2{font-family:var(--serif);font-weight:500;font-size:28px;margin:0 0 8px}
.agreement{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;max-height:52vh;overflow:auto;font-family:var(--serif);font-size:16.5px;line-height:1.6}
.agreement h3{font-family:var(--sans);font-size:15px;font-weight:700;margin:22px 0 6px;color:var(--navy)}
.agreement p{margin:0 0 10px;max-width:72ch}
.agreement .doc-title{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 14px;color:var(--navy)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#DCE3EE;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail .brand{padding:0 8px 22px;color:#fff}
.rail .who{padding:0 8px 18px;font-size:13px;color:#9DAAC0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.rail .who b{display:block;color:#fff;font-size:14px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#C3CDDC;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14.5px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(184,137,43,.18);color:#fff}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--gold);color:var(--navy);font-size:11.5px;font-weight:700;border-radius:10px;padding:1px 7px}
.rail .bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px}
main.content{padding:32px 40px 80px;max-width:1180px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-weight:500;font-size:32px;margin:0;line-height:1.1}
.page-head p{margin:4px 0 0;color:var(--ink-2)}
.section-title{font-family:var(--serif);font-weight:500;font-size:21px;margin:32px 0 12px}

/* ---------- home ---------- */
.hero-line{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px;display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero-line .big{font-family:var(--serif);font-size:30px;line-height:1.25;margin:0;max-width:24ch}
.hero-line .big .amt{color:var(--money);font-weight:600;font-variant-numeric:tabular-nums}
.hero-line .small{color:var(--ink-2);margin:10px 0 0}
.ladder{border-left:1px solid var(--line);padding-left:28px}
.ladder .lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.ladder .lab b{color:var(--ink)}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:10px;border-radius:3px;background:var(--line-2)}
.steps i.on{background:var(--gold)}
.ladder .note{font-size:13.5px;color:var(--ink-2);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-top:16px}
.stat{padding:16px 20px;border-left:1px solid var(--line-2)}
.stat:first-child{border-left:0}
.stat .v{font-family:var(--serif);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--ink-2);margin-top:2px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line-2);cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list .item:first-child{border-top:0}
.list .item:hover{background:#FAFBFD}
.list .item .main{flex:1;min-width:0}
.list .item .t{font-weight:600}
.list .item .s{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .empty{padding:22px 18px;color:var(--ink-2);font-size:14px}
.linkcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.linkrow{display:flex;gap:8px;align-items:center}
.linkrow code{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-family:var(--sans);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.codechip{display:inline-block;font-weight:700;letter-spacing:.04em;background:var(--gold-soft);color:#6B4E12;border-radius:5px;padding:1px 8px}

/* ---------- tags ---------- */
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.money{background:var(--money-soft);color:var(--money)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.navy{background:#E3E8F1;color:var(--navy)}
.due{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.due.late{color:var(--warn)}

/* ---------- pipeline board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;align-items:start}
.col{background:#EDF0F5;border-radius:var(--r);padding:10px;min-height:180px}
.col.drop{outline:2px dashed var(--gold);outline-offset:-2px}
.col h3{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;margin:4px 6px 10px}
.col h3 span{font-weight:600;color:var(--ink-3)}
.col .help{font-size:12.5px;color:var(--ink-3);margin:-6px 6px 10px}
.lead{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;display:block;width:100%;text-align:left}
.lead:hover{border-color:#B9C3D2}
.lead[draggable="true"]{cursor:grab}
.lead .n{font-weight:600}
.lead .i{font-size:13px;color:var(--ink-2)}
.lead .m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.lost-toggle{margin-top:14px}

/* ---------- tables ---------- */
.table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap}
table.t td.acts{white-space:nowrap;text-align:right}
table.t td{padding:11px 14px;border-top:1px solid var(--line-2);vertical-align:top}
table.t tr:first-child td{border-top:0}
table.t td.r,table.t th.r{text-align:right}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#FAFBFD}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

/* ---------- admin tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile .v{font-family:var(--serif);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-size:13px;color:var(--ink-2)}
.funnel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.fbar{display:grid;grid-template-columns:110px 1fr 48px;gap:12px;align-items:center;margin:8px 0;font-size:14px}
.fbar .bar{height:12px;background:var(--line-2);border-radius:3px;overflow:hidden}
.fbar .bar i{display:block;height:100%;background:var(--navy-2)}
.fbar .bar i.g{background:var(--gold)}

/* ---------- toolkit ---------- */
.res{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.res h3{font-size:15.5px;margin:0 0 3px}
.res p{margin:0;color:var(--ink-2);font-size:14px}
.res .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tmpl{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;margin-top:12px;max-height:280px;overflow:auto}
#qr{background:#fff;padding:8px;border:1px solid var(--line);border-radius:8px;width:max-content}
#qr img,#qr canvas{display:block}

/* ---------- drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(19,35,63,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(19,35,63,.18);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
.drawer header{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header h2{font-family:var(--serif);font-weight:500;font-size:24px;margin:0;line-height:1.15}
.drawer header .s{color:var(--ink-2);font-size:14px}
.drawer .body{padding:18px 22px;overflow:auto;flex:1}
.drawer footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-3);padding:2px 6px}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100vh - 40px);background:#fff;border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(19,35,63,.25)}
.modal header{padding:18px 22px 6px;display:flex}
.modal header h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0}
.modal .body{padding:8px 22px 4px;overflow:auto}
.modal footer{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end}
.stagebar{display:flex;gap:6px;flex-wrap:wrap}
.stagebar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.stagebar button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:9px 0 9px 18px;border-left:2px solid var(--line-2);position:relative;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-5px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.timeline .when{color:var(--ink-3);font-size:12.5px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:0 0 16px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0}
.callout{border-radius:var(--r-sm);padding:11px 14px;font-size:14px;margin:0 0 14px}
.callout.warn{background:var(--warn-soft);color:#7C2B24}
.callout.info{background:#E8EEF7;color:var(--navy)}
.callout.amber{background:var(--amber-soft);color:#6A4A00}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(19,35,63,.25);max-width:calc(100% - 32px)}
#toast.bad{background:var(--warn)}

/* ---------- print (agreement) ---------- */
@media print{
  .no-print{display:none !important}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;max-height:none;overflow:visible;border:0}
}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .two,.hero-line{grid-template-columns:minmax(0,1fr) !important}
  .ladder{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .gate{grid-template-columns:1fr}
  .gate-side{padding:32px 24px}
  .gate-side h1{margin-top:28px;font-size:34px}
  .shell{grid-template-columns:minmax(0,1fr)}
  main.content{min-width:0}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .rail .brand,.rail .who,.rail .bottom{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;flex:1 1 0;min-width:0;position:relative}
  .nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail{width:100%}
  .nav .badge{position:absolute;margin:0 0 0 18px;font-size:10px}
  main.content{padding:20px 16px 96px}
  .page-head h1{font-size:27px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line-2)}
  .board{grid-template-columns:repeat(4,minmax(250px,82%));overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
  .col{scroll-snap-align:start}
  .row2{grid-template-columns:1fr}
  .hero-line{padding:22px}
  .hero-line .big{font-size:25px}
  .kv{grid-template-columns:110px 1fr}
  .agreement{padding:20px}
  .mobile-top{display:flex !important}
}
.mobile-top{display:none;align-items:center;justify-content:space-between;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>

<script>
/* =========================================================================
   MacroNations Partner Portal — Phase 1
   Backend: Supabase project rtaiivegcqqmdchpguzn (mp_* tables / RPCs)
   Note: no optional chaining or nullish coalescing (house rule).
   ========================================================================= */
var SUPABASE_URL = 'https://rtaiivegcqqmdchpguzn.supabase.co';
var SUPABASE_KEY = 'sb_publishable_KCPCMiKYQoEUgG45DVF5uA_ke-UxQKm';
var SITE_URL = 'https://macronations.com';
var PORTAL_URL = window.location.origin + window.location.pathname;

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var S = { user: null, me: null, isAdmin: false, settings: null, view: 'home', leads: [], card: null, cache: {} };

/* ---------------- utilities ---------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(c) { var n = (Number(c) || 0) / 100; return n.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); }
function pct(r) { var n = Math.round((Number(r) || 0) * 10000) / 100; return n + '%'; }
function dParse(d) { if (!d) return null; if (/^\d{4}-\d{2}-\d{2}$/.test(d)) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); } return new Date(d); }
function dfmt(d) { var x = dParse(d); return x ? x.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''; }
function dshort(d) { var x = dParse(d); return x ? x.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : ''; }
function ago(d) { var x = dParse(d); if (!x) return ''; var s = (Date.now() - x.getTime()) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; if (s < 86400 * 7) return Math.floor(s / 86400) + ' d ago'; return dfmt(d); }

function isoDay(t) { var m = t.getMonth() + 1, d = t.getDate(); return t.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d; }

/* ---------------- layers: modal & drawer ---------------- */
var lastFocus = null;
function closeLayer() { $('#layer').innerHTML = ''; document.removeEventListener('keydown', escClose); if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} } }
function escClose(e) { if (e.key === 'Escape') closeLayer(); }
function openLayer(kind, title, sub, bodyHtml, footHtml) {
  lastFocus = document.activeElement;
  var cls = kind === 'drawer' ? 'drawer' : 'modal';
  $('#layer').innerHTML = '<div class="scrim" data-close></div><section class="' + cls + '" role="dialog" aria-modal="true" aria-labelledby="dlgT">' +
    '<header><div><h2 id="dlgT">' + esc(title) + '</h2>' + (sub ? '<div class="s">' + sub + '</div>' : '') + '</div><button class="xbtn" data-close aria-label="Close">×</button></header>' +
    '<div class="body">' + bodyHtml + '</div>' + (footHtml ? '<footer>' + footHtml + '</footer>' : '') + '</section>';
  $$('[data-close]', $('#layer')).forEach(function (b) { b.addEventListener('click', closeLayer); });
  document.addEventListener('keydown', escClose);
  var f = $('#layer input, #layer select, #layer textarea, #layer .body button'); if (f) f.focus(); else $('#layer .xbtn').focus();
  return $('#layer section');
}

function findOrder(id) { var os = S.cache.orders || []; for (var i = 0; i < os.length; i++) if (os[i].id === id) return os[i]; return null; }

async function aPayments() {

    '<div class="row2"><div class="field"><label class="f" for="stR">Standard rate (%)</label><input class="in" id="stR" type="number" step="0.5" value="' + p100(s.default_rate) + '"></div><div class="field"><label class="f" for="stTR">Senior Partner rate (%)</label><input class="in" id="stTR" type="number" step="0.5" value="' + p100(s.tier_rate) + '"></div></div>' +
    '<div class="row2"><div class="field"><label class="f" for="stTT">Courses to reach Senior Partner</label><input class="in" id="stTT" type="number" min="1" value="' + esc(s.tier_threshold) + '"></div><div class="field"><label class="f" for="stM">Months each course earns</label><input class="in" id="stM" type="number" min="1" value="' + esc(s.attribution_months) + '"></div></div>' +
    '<div class="row2"><div class="field"><label class="f" for="stP">Days a professor stays reserved</label><input class="in" id="stP" type="number" min="1" value="' + esc(s.lead_protection_days) + '"></div><div class="field"><label class="f" for="stMin">Minimum payout ($)</label><input class="in" id="stMin" type="number" min="0" value="' + (s.min_payout_cents / 100) + '"></div></div>' +
    '<div class="field"><label class="f" for="stE">Partner support email</label><input class="in" id="stE" type="email" value="' + esc(s.support_email) + '"></div>' +
    '<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:6px 0 14px"><input type="checkbox" id="stOpen" style="margin-top:4px"' + (s.agreements_open ? ' checked' : '') + '><span><b>Agreement signing open</b><br>Turn on only after counsel has reviewed the partner agreement. Until then approved partners can read it but not sign.</span></label>' +
    '<button class="btn primary" id="stSave">Save settings</button></div>' +
    '<div class="panel"><h2 style="font-size:22px">Partner agreement</h2><p class="hint" style="margin-top:0">Current version ' + esc(t.version) + '. Publishing creates a new version for future signers; signed copies never change. Fields like {{rate}}, {{partner_name}}, {{months}} are filled in per partner.</p>' +
    '<div class="field"><label class="f" for="agT">Title</label><input class="in" id="agT" value="' + esc(t.title) + '"></div>' +
    '<div class="field"><label class="f" for="agB">Text (lines starting with “## ” become section headings)</label><textarea class="in" id="agB" style="min-height:340px;font-size:13.5px">' + esc(t.body) + '</textarea></div>' +
    '<div class="toolbar"><button class="btn" id="agPrev">Preview</button><button class="btn primary" id="agPub">Publish new version</button></div></div></div>' +
    '<div class="panel" style="margin-top:20px"><h2 style="font-size:22px">Institutional billing</h2><p class="hint" style="margin-top:0">Used on institutional invoices. For online payment, create one Stripe payment link with <b>Customers choose what to pay</b> turned on (name it e.g. “MacroNations invoice payment”) and paste it here. Each invoice adds its own reference, so payments are matched to the right order automatically.</p>' +
    '<div class="two" style="gap:20px"><div>' +
    '<div class="field"><label class="f" for="ibL">Stripe payment link for invoices</label><input class="in" id="ibL" type="url" placeholder="https://buy.stripe.com/…" value="' + esc(s.inst_payment_link || '') + '"></div>' +
    '<div class="field"><label class="f" for="ibT">Payment terms (days)</label><input class="in" id="ibT" type="number" min="0" value="' + esc(s.inst_terms_days) + '" style="max-width:140px"></div>' +
    '<div class="field"><label class="f" for="ibC">Your details on the invoice</label><textarea class="in" id="ibC" style="min-height:90px">' + esc(s.inst_company_block || '') + '</textarea></div>' +
    '<div class="field"><label class="f" for="ibR">How to pay (shown on the invoice)</label><textarea class="in" id="ibR" style="min-height:110px" placeholder="Bank name, routing and account number for ACH or wire; address for cheques">' + esc(s.inst_remit_text || '') + '</textarea><div class="hint">Add your bank transfer details and cheque address here.</div></div>' +
    '<button class="btn primary" id="ibSave">Save billing settings</button></div>' +
    '<div><span class="f" style="display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px">Default price per student</span><div class="table-wrap"><table class="t"><caption class="sr-only">Default prices</caption><thead><tr><th scope="col">Course</th><th scope="col" class="r">Institution, per student ($)</th></tr></thead><tbody>' +
    pds.map(function (p) { return '<tr><td>' + esc(p.label) + '</td><td class="r"><input class="in num" data-pd="' + esc(p.product) + '" type="number" step="0.01" min="0" value="' + (p.seat_price_cents / 100) + '" style="max-width:120px;text-align:right;padding:6px 8px"></td></tr>'; }).join('') +
    '</tbody></table></div><p class="hint">New orders start at this price. You can change the price, discount or switch to a flat licence on any order.</p></div></div></div>');
  $('#ibSave').addEventListener('click', async function () {
    var link = val('ibL');
    if (link && !/^https:\/\//.test(link)) { toast('The payment link should start with https://', true); return; }
    var r = await sb.from('mp_settings').update({ inst_payment_link: link || null, inst_terms_days: parseInt(val('ibT'), 10) || 30, inst_company_block: $('#ibC').value.trim(), inst_remit_text: $('#ibR').value.trim(), updated_at: new Date().toISOString() }).eq('id', 'default').select().maybeSingle();
    if (r.error || !r.data) { toast(r.error ? errMsg(r.error) : 'Not saved', true); return; }
    var errs = 0;
    for (var i = 0; i < pds.length; i++) {
      var el = $('[data-pd="' + pds[i].product + '"]'); var c = Math.round(Number(el.value) * 100);
      if (c !== pds[i].seat_price_cents && c >= 0) { var u = await sb.from('mp_price_defaults').update({ seat_price_cents: c }).eq('product', pds[i].product); if (u.error) errs++; }
    }
    S.settings = r.data; toast(errs ? 'Saved, but some prices could not be updated' : 'Billing settings saved', !!errs);
  });
  $('#stSave').addEventListener('click', async function () {
    var row = { default_rate: Number(val('stR')) / 100, tier_rate: Number(val('stTR')) / 100, tier_threshold: parseInt(val('stTT'), 10), attribution_months: parseInt(val('stM'), 10), lead_protection_days: parseInt(val('stP'), 10), min_payout_cents: Math.round(Number(val('stMin')) * 100), support_email: val('stE'), agreements_open: $('#stOpen').checked, updated_at: new Date().toISOString() };
    if (!(row.default_rate >= 0 && row.default_rate <= 1 && row.tier_rate >= 0 && row.tier_rate <= 1)) { toast('Rates must be between 0 and 100.', true); return; }
    if (row.agreements_open && !s.agreements_open && !window.confirm('Open agreement signing? Do this only once counsel has reviewed the agreement text.')) return;
    var r = await sb.from('mp_settings').update(row).eq('id', 'default').select().maybeSingle();
    if (r.error || !r.data) { toast(r.error ? errMsg(r.error) : 'Not saved', true); return; }
    S.settings = r.data; toast('Settings saved');
  });
  $('#agPrev').addEventListener('click', function () { openLayer('modal', 'Preview', 'Fields are filled in when each partner signs.', '<div class="agreement" style="max-height:60vh">' + agreementHtml($('#agB').value) + '</div>', '<button class="btn primary" data-close>Close</button>'); $$('#layer [data-close]').forEach(function (b) { b.addEventListener('click', closeLayer); }); });
  $('#agPub').addEventListener('click', async function () {
    if (!window.confirm('Publish this as version ' + ((t.version || 0) + 1) + '? Partners who sign from now on get this text.')) return;
    var r = await sb.rpc('mp_admin_publish_template', { p_kind: 'partner', p_title: val('agT'), p_body: $('#agB').value });
    if (r.error) { toast(errMsg(r.error), true); return; } toast('Version ' + r.data.version + ' published'); aSettings();
  });
}

boot();
</script>
</body>
</html>
